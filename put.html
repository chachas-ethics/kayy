 <header
    id="site-header"
    class="fixed inset-x-0 top-0 z-50 transition-all duration-500"
  >

    <nav
      class="mx-auto flex h-24 max-w-[1600px] items-center justify-between pr-10 sm:px-8 lg:px-12"
      aria-label="Main navigation"
    >

    <!-- Logo -->
<a href="#home" class="group relative z-10 flex items-center gap-3" aria-label="Kavora Africa Home">
  <!-- Logo Image -->
  <img 
    src="thumbs/(LOGO 3) Tree left kavora right transparent bg.svg" 
    alt="" 
    class="-ml-5 h-36 w-auto object-contain transition-transform duration-500 group-hover:scale-105" 
  />
</a>



      <!-- Desktop Navigation -->
      <div class="hidden items-center gap-8 lg:flex">

        <a
          href="#destinations"
          class="nav-link relative py-2 text-[10px] font-medium uppercase tracking-[0.22em] text-white/90 transition-colors duration-300 hover:text-kavora-gold"
        >
          Destinations
        </a>

        <a
          href="#journeys"
          class="nav-link relative py-2 text-[10px] font-medium uppercase tracking-[0.22em] text-white/90 transition-colors duration-300 hover:text-kavora-gold"
        >
          Journeys
        </a>

         <a
          href="#about"
          class="nav-link relative py-2 text-[10px] font-medium uppercase tracking-[0.22em] text-white/90 transition-colors duration-300 hover:text-kavora-gold"
        >
          About
        </a>

        <a
          href="#journal"
          class="nav-link relative py-2 text-[10px] font-medium uppercase tracking-[0.22em] text-white/90 transition-colors duration-300 hover:text-kavora-gold"
        >
          Journal
        </a>

        <a
          href="#contact"
          class="nav-link relative py-2 text-[10px] font-medium uppercase tracking-[0.22em] text-white/90 transition-colors duration-300 hover:text-kavora-gold"
        >
          Contact
        </a>

      </div>


      <!-- Desktop CTA -->
      <div class="hidden lg:flex">

        <a
          href="#contact"
          class="group relative overflow-hidden border border-white/40 px-6 py-3 text-[9px] font-semibold uppercase tracking-[0.24em] text-white transition-all duration-500 hover:border-kavora-gold"
        >

          <span
            class="absolute inset-0 -translate-x-full bg-kavora-gold transition-transform duration-500 group-hover:translate-x-0"
          ></span>

          <span class="relative z-10 transition-colors duration-500 group-hover:text-kavora-green">
            Design Your Journey
          </span>

        </a>

      </div>


      <!-- Mobile Menu Button -->
      <button
        id="menu-toggle"
        type="button"
        class="relative z-50 flex h-10 w-10 items-center justify-center text-kavora-gold lg:hidden"
        aria-label="Open navigation menu"
        aria-expanded="false"
      >

        <span
          id="menu-icon"
          class="relative block h-4 w-5"
        >

          <span
            class="menu-line absolute left-0 top-0 h-px w-full bg-current transition-all duration-300"
          ></span>

          <span
            class="menu-line absolute left-0 top-1/2 h-px w-full -translate-y-1/2 bg-current transition-all duration-300"
          ></span>

          <span
            class="menu-line absolute left-0 bottom-0 h-px w-full bg-current transition-all duration-300"
          ></span>

        </span>

      </button>

    </nav>


    <!-- Mobile Navigation -->
    <div
      id="mobile-menu"
      class="pointer-events-none invisible absolute inset-x-0 top-0 min-h-screen bg-kavora-green opacity-0 transition-all duration-500 lg:hidden"
    >

      <div class="flex min-h-screen flex-col px-8 pb-10 pt-32">

        <div class="flex flex-col">

          <a
            href="#destinations"
            class="mobile-link border-b border-white/10 py-5 font-luxury text-4xl text-white"
          >
            Destinations
          </a>

          <a
            href="#journeys"
            class="mobile-link border-b border-white/10 py-5 font-luxury text-4xl text-white"
          >
            Journeys
          </a>

          <a
            href="#concierge"
            class="mobile-link border-b border-white/10 py-5 font-luxury text-4xl text-white"
          >
            Concierge
          </a>

          <a
            href="#about"
            class="mobile-link border-b border-white/10 py-5 font-luxury text-4xl text-white"
          >
            About
          </a>

          <a
            href="#journal"
            class="mobile-link border-b border-white/10 py-5 font-luxury text-4xl text-white"
          >
            Journal
          </a>

          <a
            href="#contact"
            class="mobile-link border-b border-white/10 py-5 font-luxury text-4xl text-white"
          >
            Contact
          </a>

        </div>


        <div class="mt-auto">

          <p class="mb-4 text-[9px] uppercase tracking-[0.3em] text-kavora-gold">
            Luxury Travel Concierge
          </p>

          <p class="max-w-xs font-luxury text-xl leading-relaxed text-white/70">
            Private journeys, exceptional stays and seamless experiences across Africa.
          </p>

        </div>

      </div>

    </div>

  </header>

 <script>

    const header = document.getElementById('site-header');
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuLines = document.querySelectorAll('.menu-line');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    let menuOpen = false;


    /* Navbar scroll state */

    window.addEventListener('scroll', () => {

      if (window.scrollY > 40) {

        header.classList.add(
          'bg-kavora-green/95',
          'backdrop-blur-xl',
          'shadow-lg',
          'shadow-black/10'
        );

        header.querySelector('nav').classList.remove('h-24');
        header.querySelector('nav').classList.add('h-20');

      } else {

        header.classList.remove(
          'bg-kavora-green/95',
          'backdrop-blur-xl',
          'shadow-lg',
          'shadow-black/10'
        );

        header.querySelector('nav').classList.remove('h-20');
        header.querySelector('nav').classList.add('h-24');

      }

    });


    /* Mobile menu */

    function toggleMenu() {

      menuOpen = !menuOpen;

      menuToggle.setAttribute('aria-expanded', menuOpen);

      if (menuOpen) {

        mobileMenu.classList.remove(
          'pointer-events-none',
          'invisible',
          'opacity-0'
        );

        mobileMenu.classList.add(
          'pointer-events-auto',
          'visible',
          'opacity-100'
        );

        menuLines[0].classList.add('rotate-45', 'top-1/2');
        menuLines[1].classList.add('opacity-0');
        menuLines[2].classList.add('-rotate-45', 'bottom-auto', 'top-1/2');

      } else {

        mobileMenu.classList.remove(
          'pointer-events-auto',
          'visible',
          'opacity-100'
        );

        mobileMenu.classList.add(
          'pointer-events-none',
          'invisible',
          'opacity-0'
        );

        menuLines[0].classList.remove('rotate-45', 'top-1/2');
        menuLines[1].classList.remove('opacity-0');
        menuLines[2].classList.remove('-rotate-45', 'bottom-auto', 'top-1/2');

      }

    }


    menuToggle.addEventListener('click', toggleMenu);


    /* Close mobile menu when a link is clicked */

    mobileLinks.forEach(link => {

      link.addEventListener('click', () => {

        if (menuOpen) {
          toggleMenu();
        }

      });

    });
    </script>
